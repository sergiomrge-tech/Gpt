name: Build Sistema Lotus APK

on:
  push:
    branches:
      - sistema-lotus-apk
    paths:
      - 'lotus-android/**'
      - '.github/workflows/lotus-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p lotus-android --stacktrace assembleDebug

      - name: Verify APK
        run: |
          test -s lotus-android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum lotus-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sistema-Lotus-v0.2.0-APK
          path: lotus-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

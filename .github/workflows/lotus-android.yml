name: Build Sistema Lotus APK

on:
  push:
    branches:
      - sistema-lotus-apk
    paths:
      - 'lotus-android/**'
      - '.github/workflows/lotus-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p lotus-android --stacktrace assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle -p lotus-android connectedDebugAndroidTest --stacktrace
            adb install -r lotus-android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.lotusdistribuidora.app
            adb shell am start -W -n com.lotusdistribuidora.app/.MainActivity
            sleep 3
            adb exec-out screencap -p > lotus-home.png

      - name: Upload UI screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Sistema-Lotus-v0.5.1-Screenshot
          path: lotus-home.png
          if-no-files-found: error

      - name: Verify APK
        run: |
          test -s lotus-android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum lotus-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sistema-Lotus-v0.5.1-APK
          path: lotus-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

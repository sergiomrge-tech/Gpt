name: Build Sistema Lotus APK

on:
  push:
    branches:
      - sistema-lotus-apk
    paths:
      - 'lotus-android/**'
      - '.github/workflows/lotus-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set update version 0.6.1
        run: |
          sed -i 's/versionCode = 11/versionCode = 12/' lotus-android/app/build.gradle.kts
          sed -i 's/versionName = "0.6.0"/versionName = "0.6.1"/' lotus-android/app/build.gradle.kts
          grep -E 'versionCode|versionName' lotus-android/app/build.gradle.kts

      - name: Build debug APK
        run: gradle -p lotus-android --stacktrace assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle -p lotus-android connectedDebugAndroidTest --stacktrace
            adb exec-out run-as com.lotusdistribuidora.app cat cache/docs/orcamento_lotus_123.jpg > lotus-quote-sample.jpg || true
            adb install -r lotus-android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.lotusdistribuidora.app
            adb shell am start -W -n com.lotusdistribuidora.app/.MainActivity
            sleep 3
            adb exec-out screencap -p > lotus-home.png
            SIZE=$(adb shell wm size | grep -oE '[0-9]+x[0-9]+' | tail -1)
            W=${SIZE%x*}
            H=${SIZE#*x}
            adb shell input tap $((W*30/100)) $((H*90/100))
            sleep 2
            adb exec-out screencap -p > lotus-clients.png
            adb shell input tap $((W*70/100)) $((H*90/100))
            sleep 2
            adb exec-out screencap -p > lotus-stock.png

      - name: Upload UI screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Sistema-Lotus-v0.6.1-QA
          path: |
            lotus-home.png
            lotus-clients.png
            lotus-stock.png
            lotus-quote-sample.jpg
          if-no-files-found: error

      - name: Verify APK
        run: |
          test -s lotus-android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum lotus-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sistema-Lotus-v0.6.1-APK
          path: lotus-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
